<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Box Model Practice</h1>
    
    <div class="box content-box">
        <h2>Content</h2>
        <p>This box has a background color to show the content area.</p>
    </div>

    <div class="box padding-box">
        <h2>Padding</h2>
        <p>This box has extra padding inside.</p>
    </div>

    <div class="box border-box">
        <h2>Border</h2>
        <p>This box has a thick border around it.</p>
    </div>

    <div class="box margin-box">
        <h2>Margin</h2>
        <p>This box has extra space outside it.</p>
    </div>

</body>
</html>
